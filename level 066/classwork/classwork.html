<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Georgian Football Squad</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f5f5f5;
            margin: 20px;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            max-width: 800px;
            margin: auto;
        }
        .squad {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }
        .player {
            width: 150px;
            height: 200px;
            background: lightblue;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            border-radius: 10px;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .player img {
            width: 100%;
            height: 70%;
            object-fit: cover;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
        }
        .player:hover {
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
        }
        .player-name {
            background: white;
            padding: 5px;
            width: 100%;
            text-align: center;
            font-weight: bold;
            border-bottom-left-radius: 10px;
            border-bottom-right-radius: 10px;
        }
        .info {
            margin-top: 20px;
            text-align: left;
            max-width: 600px;
            margin: 20px auto;
        }
        .score {
            background: purple;
            color: white;
            font-size: 20px;
            font-weight: bold;
            padding: 10px;
            display: inline-block;
            border-radius: 5px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Georgian Football Squad</h2>
        <div class="squad">
            <div class="player">
                <img src="image.png" alt="Giorgi Mamardashvili">
                <div class="player-name">Giorgi Mamardashvili</div>
            </div>
            <div class="player">
                <img src="image copy.png" alt="">
                <div class="player-name">khvicha kvaratskhelia</div>
            </div>
            <div class="player">
                <img src="image copy 2.png" alt="">
                <div class="player-name">george mikautadze</div>
            </div>
            <div class="player">
                <img src="image copy 3.png" alt="">
                <div class="player-name">giorgi kochorashvili</div>
            </div>
        </div>
        <div class="info">
            <p>Lorem Ipsum is simply dummy text of the printing and typesetting industry. Lorem Ipsum has been the industry's standard dummy text ever since the 1500s...</p>
        </div>
    </div>
</body>
</html>
