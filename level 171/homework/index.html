<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-links">
            <a href="#">&lt; Take Notes &gt;</a>
            <a href="#">NEW NOTES</a>
            <a href="#">VIEW ALL NOTES</a>
            <a href="#">NEW TAG</a>
            <a href="#">VIEW ALL TAGS</a>
        </div>
        <div class="welcome">Welcome, omkarpathak</div>
    </nav>

    <div class="container">
        <div class="form-section">
            <div class="form-row">
                <label for="note-title">Note Title:</label>
                <input type="text" id="note-title" placeholder="Enter note title">
            </div>

            <div class="form-row">
                <label for="note-content">
                    Your Note: 
                    <span class="note-hint">(Also supports Markdown. For markdown reference visit: <a href="#">here</a>)</span>
                </label>
                <textarea id="note-content" placeholder="Start typing your note..."></textarea>
            </div>

            <div class="form-row">
                <label for="note-tags">Note Tags:</label>
                <select id="note-tags" multiple>
                    <option>Python</option>
                    <option>Artificial Intelligence</option>
                    <option>Useful Links</option>
                    <option>Github</option>
                </select>
            </div>

            <div class="preview-section">
                <div class="preview-title">Preview:</div>
                <div class="preview-box" id="preview">
                    Your note preview will appear here...
                </div>
            </div>

            <button class="add-note-btn">Add Note</button>
        </div>
    </div>

        <script>
        const noteContent = document.getElementById('note-content');
        const preview = document.getElementById('preview');

        noteContent.addEventListener('input', function() {
            if (this.value.trim()) {
                preview.textContent = this.value;
            } else {
                preview.textContent = 'Your note preview will appear here...';
            }
        });

        document.querySelector('.add-note-btn').addEventListener('click', function() {
            const title = document.getElementById('note-title').value;
            const content = document.getElementById('note-content').value;
            const tags = Array.from(document.getElementById('note-tags').selectedOptions).map(opt => opt.value);
            
            if (title && content) {
                alert('Note added successfully!\n\nTitle: ' + title + '\nTags: ' + tags.join(', '));
                document.getElementById('note-title').value = '';
                document.getElementById('note-content').value = '';
                document.getElementById('note-tags').selectedIndex = -1;
                preview.textContent = 'Your note preview will appear here...';
            } else {
                alert('Please fill in both title and content.');
            }
        });
    </script>
</body>
</html>
