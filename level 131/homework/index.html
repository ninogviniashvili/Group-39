<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="sidebar">
    <div>
        <img style="height: 40px; width: 40px; border-radius: 50%;" src="sunflower.png" alt="">
        <h2 style="position: absolute; top: 28px; left:57px;">Frank</h2>
    </div>
    <ul>
      <li>COVID-19 Info</li>
      <li>Pages</li>
      <li>Friends</li>
      <li>Messenger</li>
      <li>Marketplace</li>
      <li>Videos</li>
    </ul>
  </div>

  <div class="main">
    <div class="navbar">
    <img style="width: 30px; height: 30px;" src="fb.png" alt="">
      <input type="text" placeholder="Search Facebook">
      <img src="image copy 2.png" alt="">
    </div>

    <div class="stories">
      <div class="story" style="background:url('story.png') center/cover;">Your Story</div>
      <div class="story" style="background:url('john.png') center/cover;">John Doe</div>
      <div class="story" style="background:url('bela.png') center/cover;">Bella</div>
      <div class="story" style="background:url('adam.png') center/cover;">Adam</div>
    </div>

    <div class="post-box">
    <div>

        <input style="position: absolute; top: 340px; left: 330px;" type="text" placeholder="What's on your mind, Frank?">
        <input style="position: absolute; top: 340px; left: 970px; width: 30%;" type="text" placeholder="Image URL (optional)">
        <img style="height: 40px; width: 40px; border-radius: 50%;" src="sunflower.png" alt="">
    </div>
      <div class="post-actions">
        <button>🎥 Live Video</button>
        <button>📷 Photo/Video</button>
        <button>😊 Feeling/Activity</button>
      </div>
    </div>

    <div class="feed">
    <div>
    <img style="height: 40px; width: 40px; border-radius: 50%;" src="T.png" alt="">
    <h3 style="position: absolute; top: 477px; left: 330px;">Test - July 11, 2021</h3>
    <p style="position: absolute; top: 501px; left: 330px; font-weight: lighter; color: #717070; font-size: small;" >Sun Jul 1 2021</p>
    </div>
      <img src="image copy.png" alt="Post image">
    </div>
  </div>
</body>
</html>
