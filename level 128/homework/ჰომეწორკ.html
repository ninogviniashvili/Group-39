<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
<style>
  body { background: #f0f2f5; font-family: Arial, sans-serif; padding: 20px;}
  h1 { text-align: center; margin-bottom: 30px;}
  .game, .github { background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 30px;}
  .buttons button { margin: 5px;}
  #result { font-weight: bold; font-size: 1.3em; margin-top: 10px;}
  #status { color: #555;}
  #box img { border-radius: 10px; margin-top: 10px;}
  @media (max-width: 576px){.buttons button{width:100%; margin-bottom:5px;}}
</style>
</head>
<body>

<h1>Fun Game & GitHub Info</h1>

<div class="game">
  <h2>Rock-Paper-Scissors</h2>
  <div class="buttons mb-3">
    <button class="btn btn-primary" onclick="playGame('rock')">Rock</button>
    <button class="btn btn-success" onclick="playGame('paper')">Paper</button>
    <button class="btn btn-warning" onclick="playGame('scissors')">Scissors</button>
  </div>
  <p>User Score: <span id="user-score">0</span> | Computer Score: <span id="computer-score">0</span></p>
  <p id="result"></p>
  <p id="status"></p>
</div>

<div class="github">
  <h2>GitHub User Info</h2>
  <form id="frm" class="mb-3">
    <div class="input-group">
      <input type="text" id="myInpt" class="form-control" placeholder="Enter GitHub username" required>
      <button class="btn btn-dark" type="submit"><i class="bi bi-search"></i> Search</button>
    </div>
  </form>
  <div id="box"></div>
</div>

<script>
let userScore = 0;
let computerScore = 0;

function playGame(userChoice) {
  const choices = ['rock', 'paper', 'scissors'];
  const computerChoice = choices[Math.floor(Math.random() * 3)];

  let resultText = '';
  if(userChoice === computerChoice) resultText = 'TIE!';
  else if (
    (userChoice === 'rock' && computerChoice === 'scissors') ||
    (userChoice === 'paper' && computerChoice === 'rock') ||
    (userChoice === 'scissors' && computerChoice === 'paper')
  ) {
    userScore++;
    resultText = 'YOU WIN!';
  } else {
    computerScore++;
    resultText = 'AI WON!';
  }

  document.getElementById('user-score').textContent = userScore;
  document.getElementById('computer-score').textContent = computerScore;
  document.getElementById('result').textContent = resultText;
  document.getElementById('status').textContent = `You: ${userChoice}, Computer: ${computerChoice}`;
}

// GitHub
const myFrm = document.getElementById('frm');
const myInpt = document.getElementById("myInpt");
const box = document.getElementById("box");

myFrm.addEventListener('submit', e => {
  e.preventDefault();
  const name = myInpt.value.trim();
  if(!name) return;

  fetch(`https://api.github.com/users/${name}`)
    .then(res => res.json())
    .then(showData)
    .catch(err => box.innerHTML = `<p class="text-danger">Error: ${err}</p>`);
});

function showData(info) {
  box.innerHTML = `
    <div class="text-center">
      <img src="${info.avatar_url}" width="150" alt="Avatar"/>
      <h3>${info.name || info.login}</h3>
      <p>Company: ${info.company || 'N/A'}</p>
      <p>Bio: ${info.bio || 'N/A'}</p>
      <p>Public Repos: ${info.public_repos}</p>
      <a href="${info.html_url}" target="_blank" class="btn btn-outline-primary btn-sm mt-2">View Profile</a>
    </div>
  `;
}
</script>

</body>
</html>
