<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Limesharp Style Layout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <div class="left">
        <img src="image.png" alt="">
    </div>

    <div class="right">

      <header>
        <h3 class="logo">LIMESHARP</h3>
        <p class="menu">MENU</p>
      </header>

      <h1>
        REDEFINING THE FUTURE<br>
        OF DIGITAL COMMERCE
      </h1>

      <a href="#" class="link">Find Out How</a>

      <div class="cards">

        <div class="card">
          <img src="Screenshot 2025-12-22 200615.png" alt="">
          <h3>COLLECTORS CLUB →</h3>
          <p>
            Limesharp have partnered with the Paul Smith team
            to take this from concept to delivery.
          </p>
        </div>

        <div class="card">
          <img src="Screenshot 2025-12-22 200758.png" alt="">
          <h3>ANYA HINDMARCH</h3>
          <p>
            Anya Hindmarch isn’t just a fashion label.
            It’s a brand with purpose.
          </p>
        </div>

      </div>

    </div>
  </div>

</html>
